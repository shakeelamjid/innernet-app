<!DOCTYPE html>
<!--
  Innernet — LOCAL connect screen.

  Bundled inside the APK at app/src/main/assets/connect.html and made the
  launch page. Everything on the critical path (see held connections, pick one,
  connect, disconnect, see status, scan/paste a new one, remove one) is driven
  entirely by the window.Innernet bridge — ZERO network. It therefore works:
    • with no internet at all (no more blank "can't reach" dead-end), and
    • when innernetcorp.com is BLOCKED by a censor — which is the case that
      matters, because the config already lives in the tunnel engine and the
      moment the tunnel is up it unblocks the site itself.

  Managing a plan (buy / renew / see quota) genuinely needs the network, so
  those are links out to the server pages. When the site is blocked they won't
  open until the tunnel is up — which is exactly the bootstrap this screen
  enables, and the copy says so.

  It uses only the v7 bridge surface, so it drops into the next build with no
  bridge-method change. SITE is templated in by the build (brand.sh / add_webview).
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Innernet</title>
<style>
  :root{--bg:#09090b;--card:#141416;--bd:#232327;--ink:#fafafa;--mut:#8b8b93;--dim:#5f5f66;
    --acc:#17e6c9;--acc-deep:#0c9c88;--acc-ink:#04211d;--red:#f87171;--amber:#fbbf24}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  a{color:inherit;text-decoration:none}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;flex:none}
  .mk{display:flex;align-items:center;gap:8px;font-weight:650;font-size:16px;letter-spacing:-.02em}
  .mk svg{width:20px;height:20px;color:var(--acc)}
  .chip{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:5px 11px}
  main{flex:1;display:flex;flex-direction:column;padding:0 18px;min-height:0;overflow-y:auto}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;min-height:340px}
  .dial{position:relative;width:236px;height:236px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer}
  .brk{position:absolute;width:34px;height:34px;border:3px solid var(--bd);border-radius:4px;transition:.35s}
  .brk.tl{top:0;left:0;border-right:0;border-bottom:0}.brk.tr{top:0;right:0;border-left:0;border-bottom:0}
  .brk.bl{bottom:0;left:0;border-right:0;border-top:0}.brk.br{bottom:0;right:0;border-left:0;border-top:0}
  .on .brk{border-color:#2a2a2e}
  .ring{position:absolute;inset:26px;border-radius:50%;border:1px solid var(--bd);transition:.35s}
  .on .ring{border-color:rgba(23,230,201,.18)}
  .mark{width:104px;height:104px;color:#3f3f46;transition:.35s}.mark svg{width:100%;height:100%}
  .on .mark{color:var(--acc);filter:drop-shadow(0 0 10px rgba(23,230,201,.55)) drop-shadow(0 0 28px rgba(23,230,201,.28))}
  .on .mark svg{animation:pulse 3.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
  .state{text-align:center}
  .state .s{font-size:21px;font-weight:650;letter-spacing:-.02em}
  .state .h{font-size:13px;color:var(--mut);margin-top:4px}
  .on .state .s{color:var(--acc)}
  #why{display:none;text-align:center;font-size:11.5px;color:var(--dim);margin-top:2px;padding:0 20px;line-height:1.6}
  #why pre{margin-top:8px;font-size:10.5px;color:var(--mut);text-align:start;background:#0c0c0e;
    border:1px solid var(--bd);border-radius:8px;padding:9px;max-height:120px;overflow:auto;
    white-space:pre-wrap;word-break:break-word}
  .plan{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
  .plan .nm{font-size:14px;font-weight:600}
  .plan select{width:100%;background:transparent;border:0;color:var(--ink);font:inherit;font-size:14px;font-weight:600;
    padding:0 20px 0 0;appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right center;background-size:16px}
  .plan select:focus{outline:none}.plan select option{background:#141416;color:var(--ink)}
  .actions{display:flex;gap:8px;width:100%;margin-top:2px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--bd);
    border-radius:12px;padding:13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
    background:transparent;color:var(--ink)}
  .btn svg{width:17px;height:17px}
  .btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  .manage{width:100%;display:flex;gap:8px;margin-top:2px}
  .manage a{flex:1;text-align:center;border:1px solid var(--bd);border-radius:11px;padding:11px;
    font-size:12.5px;color:var(--mut)}
  .hint{width:100%;font-size:11px;color:var(--dim);text-align:center;line-height:1.5;padding:0 6px}
  .banner{display:none;margin:0 18px 8px;background:#1e1808;border:1px solid #3a3116;color:var(--amber);
    border-radius:10px;padding:11px 13px;font-size:12.5px;flex:none;align-items:center;justify-content:space-between;gap:10px}
  .banner a{color:var(--acc);font-weight:600;white-space:nowrap}
  .empty{width:100%;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.6}
  .stamp{text-align:center;font-size:10px;color:var(--dim);padding:2px 0 6px;flex:none}
</style>
</head>
<body>
<div class="bar">
  <span class="mk"><svg viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"><line x1="88.9" y1="26.3" x2="88.9" y2="212.7"/><line x1="119.3" y1="8.1" x2="120.3" y2="230.9"/><line x1="57.5" y1="45.6" x2="216.5" y2="140.8"/><line x1="215.5" y1="63.8" x2="24.1" y2="174.2"/><line x1="211.5" y1="180.3" x2="125.4" y2="229.9"/><line x1="92.0" y1="25.3" x2="217.5" y2="101.3"/><line x1="54.5" y1="45.6" x2="54.5" y2="192.4"/><line x1="21.1" y1="66.8" x2="21.1" y2="172.2"/><line x1="28.2" y1="66.8" x2="215.5" y2="175.2"/><line x1="218.5" y1="65.8" x2="218.5" y2="173.2"/></svg>Innernet</span>
  <span class="chip" id="netchip">·</span>
</div>

<div class="banner" id="updateBanner">
  <span id="updateText">A newer version of the app is available.</span>
  <a id="updateLink" href="#">Update →</a>
</div>

<main>
  <div class="stage" id="stage">
    <button class="dial" id="dial" aria-label="Connect">
      <span class="brk tl"></span><span class="brk tr"></span><span class="brk bl"></span><span class="brk br"></span>
      <span class="ring"></span>
      <span class="mark"><svg viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><line x1="88.9" y1="26.3" x2="88.9" y2="212.7"/><line x1="119.3" y1="8.1" x2="120.3" y2="230.9"/><line x1="57.5" y1="45.6" x2="216.5" y2="140.8"/><line x1="215.5" y1="63.8" x2="24.1" y2="174.2"/><line x1="211.5" y1="180.3" x2="125.4" y2="229.9"/><line x1="216.5" y1="142.8" x2="90.9" y2="213.7"/><line x1="92.0" y1="25.3" x2="217.5" y2="101.3"/><line x1="54.5" y1="45.6" x2="54.5" y2="192.4"/><line x1="21.1" y1="66.8" x2="21.1" y2="172.2"/><line x1="125.4" y1="9.1" x2="213.5" y2="59.7"/><line x1="115.3" y1="9.1" x2="26.1" y2="60.8"/><line x1="28.2" y1="66.8" x2="215.5" y2="175.2"/><line x1="216.5" y1="103.3" x2="56.5" y2="193.4"/><line x1="218.5" y1="65.8" x2="218.5" y2="173.2"/><line x1="26.1" y1="178.2" x2="114.2" y2="229.9"/></svg></span>
    </button>

    <div id="why"></div>

    <div id="live" style="display:none;width:100%;text-align:center">
      <div style="font-size:11.5px;color:var(--dim);letter-spacing:.04em;
                  text-transform:uppercase">Your connection</div>
      <div style="margin-top:3px">
        <b id="mbps" style="font-size:26px;letter-spacing:-.02em">—</b>
        <span style="font-size:13px;color:var(--mut)"> Mbps</span>
      </div>
      <button id="retest" style="margin-top:6px;background:none;border:0;
              color:var(--acc);font:inherit;font-size:12px;cursor:pointer">
        Test again</button>
    </div>

    <div class="state">
      <div class="s" id="stateText">Tap to connect</div>
      <div class="h" id="stateHint">Not connected</div>
    </div>

    <div class="plan" id="planBox" style="display:none">
      <select id="pick" aria-label="Which connection" style="display:none"></select>
      <div class="nm" id="pickOne" style="display:none"></div>
    </div>

    <div class="actions" id="addActions">
      <button class="btn" id="scanBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M7 12h10"/></svg>Scan</button>
      <button class="btn" id="pasteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>Paste</button>
      <button class="btn" id="removeBtn" style="display:none;color:var(--red);border-color:#3a2626">Remove</button>
    </div>

    <div class="manage" id="manage">
      <a id="mBuy" href="#">Buy</a>
      <a id="mRenew" href="#">Renew</a>
      <a id="mAccount" href="#">My plan</a>
    </div>
    <div class="hint" id="manageHint"></div>
  </div>
</main>

<div class="stamp" id="stamp"></div>

<!-- Server content arrives here, inside the app, instead of replacing it. The
     old design navigated away; the server page then showed its own tab bar and
     took the customer to a different connect screen that had no session, could
     not see the config and could not reliably disconnect. Keeping this page
     mounted removes that whole class of confusion: there is one screen, and it
     never goes anywhere. -->
<div id="sheet" style="display:none;position:fixed;inset:0;background:var(--bg);
     z-index:50;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;
       padding:12px 16px;border-bottom:1px solid var(--bd);flex:none">
    <b id="sheetTitle" style="font-size:15px">My plan</b>
    <button id="sheetClose" style="background:none;border:0;color:var(--acc);
            font:inherit;font-size:14px;cursor:pointer;padding:6px 4px">Done</button>
  </div>
  <div id="sheetBody" style="flex:1;overflow-y:auto;padding:16px"></div>
  <iframe id="sheetFrame" style="display:none;flex:1;width:100%;border:0"></iframe>
</div>

<script>
(function(){
  // ---- where the server lives. Templated by the build; safe default. --------
  var SITE = "%%SITE%%";
  if (SITE.indexOf("%%") === 0) SITE = "https://innernetcorp.com";  // dev fallback
  var M = SITE.replace(/\/+$/,"") + "/m";

  var $ = function(id){ return document.getElementById(id); };
  var stage=$("stage"), dial=$("dial"), txt=$("stateText"), hint=$("stateHint"), why=$("why");

  // ---- the bridge may arrive AFTER this page's script (cold start), so never
  //      cache a null; re-read live and wait for it. -------------------------
  function bridge(){ return window.Innernet || null; }
  var BR = bridge();

  var T = {
    off:"Tap to connect", on:"Connected", conn:"Connecting…",
    offh:"Not connected", onh:"You're protected", allow:"Allow the VPN when asked",
    nothrough:"No internet", nothrough_h:"The tunnel is on, but nothing is getting through",
    failed:"Couldn't connect. Try again.", nocfg:"Nothing to connect with — add one below",
    none_t:"No connection yet", none_h:"Scan a card or paste a link to begin"
  };

  var busy=false, failed=false;

  function paint(isOn){
    if(isOn){ failed=false; why.style.display="none"; }
    stage.classList.toggle("on", !!isOn);
    txt.textContent = isOn ? T.on : (hasAny() ? T.off : T.none_t);
    if(failed && !isOn) return;                 // keep a failure + its reason visible
    // The VPN service starts happily with no network at all, so "the service is
    // running" is NOT "your traffic is going somewhere". navigator.onLine is no
    // use for telling them apart: a WebView counts the VPN interface itself as
    // a network and reports true in airplane mode. The only honest signal is
    // whether anything actually moved, which is what the measurement below
    // records — so the headline follows THAT, not the service.
    if(isOn && TRAFFIC === false){
      txt.textContent = T.nothrough;
      txt.style.color = "var(--amber)";
      hint.textContent = T.nothrough_h;
      hint.style.color = "var(--amber)";
      return;
    }
    txt.style.color = "";
    hint.style.color = "";
    hint.textContent = isOn ? T.onh : (hasAny() ? T.offh : T.none_h);
  }

  // ---- held connections come straight from the engine — no network ----------
  var CONFIGS = [];
  function readConfigs(){
    CONFIGS = [];
    if(!BR || typeof BR.listConfigs !== "function") return;
    try{ CONFIGS = JSON.parse(BR.listConfigs() || "[]") || []; }catch(e){ CONFIGS=[]; }
  }
  function hasAny(){ return CONFIGS.length > 0; }

  function drawConfigs(){
    readConfigs();
    var planBox=$("planBox"), pick=$("pick"), one=$("pickOne"), removeBtn=$("removeBtn");
    if(!hasAny()){
      planBox.style.display="none"; removeBtn.style.display="none"; return;
    }
    removeBtn.style.display="";
    planBox.style.display="";
    // Two elements, shown and hidden — never replaced. Swapping the <select>
    // for a <div> when only one config was held destroyed the element for good,
    // so adding a second one filled a div with <option> tags: the names showed
    // as plain stacked text and nothing could be chosen ever again.
    if(CONFIGS.length > 1){
      one.style.display = "none";
      pick.style.display = "";
      pick.innerHTML = CONFIGS.map(function(c){
        var nm=(c.name||"").replace(/[<>&]/g,"");
        return '<option value="'+c.id+'"'+(c.selected?" selected":"")+">"+nm+"</option>";
      }).join("");
    } else {
      pick.style.display = "none";
      one.style.display = "";
      one.textContent = CONFIGS[0].name || "";
    }
  }

  // switching the selected config (restarts the tunnel if it's up — the bridge
  // handles that). Pure bridge, no network.
  document.addEventListener("change", function(e){
    if(e.target && e.target.id==="pick" && BR && BR.selectConfig){
      try{ BR.selectConfig(e.target.value); }catch(_){}
      setTimeout(truth, 500);
    }
  });

  // ---- the truth about connection state is the service, via the bridge ------
  function truth(){
    if(busy) return;
    if(BR && typeof BR.isConnected === "function"){
      try{ paint(BR.isConnected()); }catch(e){}
    } else {
      paint(false);
    }
  }

  // the service pushes state on this event; believe it over any guess
  window.addEventListener("innernet:state", function(e){
    if(busy) return;
    paint(e.detail && e.detail.connected);
  });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh(); });
  window.addEventListener("pageshow", refresh);
  setInterval(function(){ if(!document.hidden) truth(); }, 3000);

  // resolve as soon as the service says it's up, or give up after ms
  function waitForTunnel(ms){
    return new Promise(function(resolve){
      var deadline=Date.now()+ms, done=false;
      function finish(v){ if(done) return; done=true;
        window.removeEventListener("innernet:state", onState); clearInterval(poll); resolve(v); }
      function onState(e){ if(e.detail && e.detail.connected) finish(true); }
      window.addEventListener("innernet:state", onState);
      var poll=setInterval(function(){
        try{ if(BR && BR.isConnected && BR.isConnected()) return finish(true); }catch(e){}
        if(Date.now()>deadline) finish(false);
      }, 500);
    });
  }

  function showWhy(){
    if(!BR || typeof BR.diagnostics!=="function"){ why.style.display="none"; return; }
    try{
      var d=JSON.parse(BR.diagnostics()||"{}");
      var msg = d.error ? d.error
        : ("Using "+(d.selected||"—")+(d.server?" · "+d.server+":"+d.port:"")+" · "+d.configs+" saved");
      if(!d.error){
        var flags=[];
        if(d.notifications===false) flags.push("notifications blocked");
        if(d.vpnReady===false) flags.push("VPN permission missing");
        if(flags.length) msg += " · " + flags.join(" · ");
      }
      why.textContent = msg; why.style.display="block";
      if(typeof BR.lastLog==="function"){
        try{ var lg=(BR.lastLog()||"").trim();
          if(lg){ var pre=document.createElement("pre"); pre.textContent=lg; why.appendChild(pre); }
        }catch(e){}
      }
    }catch(e){ why.style.display="none"; }
  }

  dial.onclick = async function(){
    if(busy) return;
    if(!BR){ BR = bridge(); }                    // may have arrived since load
    if(!hasAny()){ $("scanBtn").focus(); return; }
    if(!BR || typeof BR.setConnected!=="function"){ hint.textContent=T.failed; return; }
    // Deliberately NOT refusing to connect when navigator.onLine is false:
    // that signal is unreliable in a WebView (captive portals, restricted
    // networks), and blocking the button on a bad guess strands someone who
    // could have connected. Let the attempt happen; just never claim a success
    // that did not occur — see paint().
    busy=true; failed=false; why.style.display="none";
    var goingOn = !stage.classList.contains("on");
    txt.textContent=T.conn; hint.textContent = goingOn ? T.allow : "";
    try{
      var started = await BR.setConnected(goingOn);
      if(goingOn && started===false) throw new Error("nothing to start");
      if(goingOn){
        var ok = await waitForTunnel(25000);     // permission dialog + startup take real time
        if(!ok) throw new Error("did not come up");
        paint(true);
      } else { paint(false); }
    }catch(e){
      paint(false); failed=true;
      hint.textContent = (""+e.message).indexOf("nothing")>=0 ? T.nocfg : T.failed;
      showWhy();
    }
    busy=false;
  };

  // ---- add / remove: all local, so it works even when the site is blocked ---
  $("scanBtn").onclick = function(){ if(BR && BR.scan) try{ BR.scan(); }catch(e){} };
  $("pasteBtn").onclick = function(){ if(BR && BR.paste) try{ BR.paste(); }catch(e){} };
  $("removeBtn").onclick = function(){
    if(!confirm("Remove this connection from this phone?")) return;
    if(BR && BR.removeConfig){ try{ BR.removeConfig(); }catch(e){} }
    setTimeout(function(){ drawConfigs(); truth(); }, 300);
  };

  // ---- manage-plan links go to the server; when the site is blocked they open
  //      only once the tunnel is up. That's the bootstrap, and we say so. -----
  function sheetLink(el, title, url){
    if(!el) return;
    el.href = "#";
    el.onclick = function(e){
      e.preventDefault();
      history.pushState({sheet:1}, "");     // so Back closes the sheet
      // Every screen is drawn here now. Nothing loads a server page, so there
      // is one header, one set of buttons, and no second navigation appearing
      // underneath the app's own.
      if(title === "Renew"){ showRenew(); }
      else if(title === "Buy"){ showBuy(); }
      else { showPlan(); }
      return false;
    };
  }
  sheetLink($("mBuy"), "Buy", "");
  sheetLink($("mRenew"), "Renew", "");          // drawn here, not fetched
  sheetLink($("mAccount"), "My plan", "");

  // ---- online-only niceties: reachability chip + "newer app" banner. These
  //      NEVER block anything; if the fetch fails (offline / blocked) we stay
  //      silent and the connect screen is fully usable regardless. ------------
  function probe(){
    var chip=$("netchip");
    // A HEAD to the version endpoint; timeout so a blocked site fails fast.
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, 3500) : null;
    fetch(M.replace(/\/m$/,"") + "/app/min-version", {
      cache:"no-store", signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if(to) clearTimeout(to);
      chip.textContent = "online"; chip.style.color="var(--acc)";
      $("manageHint").textContent = "";
      if(j && BR && typeof BR.version==="function"){
        var have=0; try{ have=BR.version()|0; }catch(e){}
        // build number lives in the UA the server reads; but a hard bridge gap
        // (installed < required) is worth surfacing here too.
        if(typeof j.required==="number" && have < j.required){
          $("updateText").textContent = "Your app is out of date — update to keep connecting.";
          $("updateLink").href = j.latest_url || (SITE + "/app");
          $("updateBanner").style.display="flex";
        } else if(j.build_newer){
          $("updateText").textContent = "A newer version of the app is available.";
          $("updateLink").href = j.latest_url || (SITE + "/app");
          $("updateBanner").style.display="flex";
        }
      }
    }).catch(function(){
      if(to) clearTimeout(to);
      chip.textContent = "offline"; chip.style.color="var(--dim)";
      // the honest, useful nudge: the store is unreachable *until* you connect
      $("manageHint").textContent =
        "Can't reach the store right now. If it's blocked, tap Connect first — the tunnel opens it.";
    });
  }

  // ---- version stamp (this build), always visible so a stale APK is obvious --
  function stamp(){
    var el=$("stamp"); if(!BR){ el.textContent=""; return; }
    // The build tag, not the bridge number. The bridge number is an internal
    // compatibility marker that stays put across releases, so showing it made a
    // freshly updated app look stale. The shell puts the build in its UA.
    var m = /InnernetApp\/([0-9.]+)/.exec(navigator.userAgent || "");
    el.textContent = m ? ("App version " + m[1]) : "";
  }

  function refresh(){ readConfigs(); drawConfigs(); truth(); stamp(); probe(); }

  // Called by the app after a scan or a paste. It used to navigate to a server
  // page, which cannot work from a bundled file:// page and left a blank white
  // screen. Re-reading the engine is all that is actually needed, and it works
  // with no network.
  window.innernetImported = function(){
    readConfigs(); drawConfigs(); truth();
    if(hasAny()){ hint.textContent = "Connection added"; }
  };

  // ---- how fast is this connection, here, right now -----------------------
  // Not "how much data have you used" — that reads zero when idle and tells a
  // customer nothing. This pulls a fixed block through the tunnel and times it,
  // which is the number they actually mean when they say the app feels slow.
  // The same measurement is the only view anyone gets of the leg between a
  // customer and the server; the panel cannot see it from the other end.
  var testing = false;
  // null = not established yet, true = something came back, false = nothing did.
  var TRAFFIC = null;
  function showSpeed(v){ var el=$("mbps"); if(el) el.textContent = v; }

  async function measure(report){
    if(testing || !stage.classList.contains("on")) return;
    testing = true; showSpeed("…");
    var bytes = 3000000;
    var url = SITE + "/speed/probe?bytes=" + bytes + "&r=" + Date.now();
    var t0 = Date.now(), firstByte = 0, got = 0;
    try{
      var ctrl = ("AbortController" in window) ? new AbortController() : null;
      var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, 20000) : null;
      var resp = await fetch(url, {cache:"no-store", signal: ctrl ? ctrl.signal : undefined});
      if(!resp.ok) throw new Error("probe " + resp.status);
      if(resp.body && resp.body.getReader){
        var reader = resp.body.getReader();
        while(true){
          var r = await reader.read();
          if(r.done) break;
          if(!firstByte) firstByte = Date.now() - t0;
          got += r.value.length;
        }
      } else {
        var buf = await resp.arrayBuffer();
        got = buf.byteLength; firstByte = Date.now() - t0;
      }
      if(to) clearTimeout(to);
      var secs = Math.max((Date.now() - t0) / 1000, 0.05);
      var mbps = (got * 8) / secs / 1000000;
      showSpeed(mbps >= 100 ? mbps.toFixed(0) : mbps.toFixed(1));
      TRAFFIC = true;
      truth();
      if(report) send(mbps, firstByte);
    }catch(e){
      // Nothing came back. Either there is no network at all, or the tunnel is
      // up but carrying nothing — from the customer's side those are the same
      // thing, and both mean the screen must stop saying "Connected".
      showSpeed("—");
      TRAFFIC = false;
      truth();
    }
    testing = false;
  }

  function send(mbps, ttfb){
    // Anonymous: a speed, a rough place from the device's own timezone, nothing
    // else. The IP would be useless anyway — through the tunnel it is the
    // server's own.
    var tz = "";
    try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; }catch(e){}
    try{
      // The config's token when we have it, so an operator answering "it is
      // slow for me" can see what this customer's phone actually measured
      // rather than guessing. Nothing else is attached — no address, no
      // destination, no history.
      var body = "mbps=" + encodeURIComponent(mbps.toFixed(2)) +
                 "&ttfb=" + encodeURIComponent(ttfb) +
                 "&tz=" + encodeURIComponent(tz) +
                 (PLAN_TOKEN ? "&token=" + encodeURIComponent(PLAN_TOKEN) : "");
      fetch(SITE + "/speed/report", {method:"POST", mode:"no-cors",
        headers:{"Content-Type":"application/x-www-form-urlencoded"}, body: body});
    }catch(e){}
  }

  // ---- the sheet: one screen, content swapped inside it -------------------
  function openSheet(title){
    $("sheetTitle").textContent = title;
    $("sheet").style.display = "flex";
  }
  function closeSheet(){
    stopWatching();
    $("sheet").style.display = "none";
    $("sheetFrame").style.display = "none";
    $("sheetFrame").src = "about:blank";
    $("sheetBody").style.display = "block";
    refresh();                                   // re-read the engine on return
  }
  $("sheetClose").onclick = closeSheet;
  // The back button should close the sheet, not leave the app.
  window.addEventListener("popstate", function(){
    if($("sheet").style.display === "flex") closeSheet();
  });

  function sheetHTML(html){
    $("sheetFrame").style.display = "none";
    $("sheetBody").style.display = "block";
    $("sheetBody").innerHTML = html;
  }
  var sheetTimer = null;
  function sheetURL(url){
    // Buy and renew are genuinely online-only, so they stay server-rendered —
    // but inside the sheet, where a failure is contained.
    var f = $("sheetFrame");
    $("sheetBody").style.display = "none";
    f.style.display = "block";
    var loaded = false;
    f.onload = function(){ loaded = true; if(sheetTimer) clearTimeout(sheetTimer); };
    clearTimeout(sheetTimer);
    // A frame that cannot load renders nothing at all — a black panel with no
    // explanation, which is what a customer saw when the site was unreachable.
    sheetTimer = setTimeout(function(){
      if(loaded) return;
      f.style.display = "none";
      $("sheetBody").style.display = "block";
      $("sheetBody").innerHTML =
        '<p style="color:var(--mut);font-size:14px;line-height:1.6">' +
        "This part needs the store, and it can't be reached right now.</p>" +
        '<p style="color:var(--dim);font-size:12.5px;margin-top:10px">' +
        "If the site is blocked where you are, connect first — the tunnel opens " +
        "it. Your connection keeps working either way.</p>";
    }, 9000);
    f.src = url;
  }

  // The panel identifies a customer by a session cookie, which a page loaded
  // from file:// can never establish — that is why Renew kept offering to build
  // a new plan instead of renewing the one this phone holds. /api/plan hands
  // back the same token the mobile pages accept in the url, so carry it.
  var PLAN_TOKEN = "";

  function storeURL(path){
    var u = M + path + "?embed=1";
    if(PLAN_TOKEN) u += "&t=" + encodeURIComponent(PLAN_TOKEN);
    return u;
  }

  function configId(){
    if(!BR || typeof BR.currentLink !== "function") return "";
    try{ return BR.currentLink() || ""; }catch(e){ return ""; }
  }

  async function showPlan(){
    openSheet("My plan");
    var id = configId();
    if(!id){
      sheetHTML('<p style="color:var(--mut);font-size:14px;line-height:1.6">' +
        'This phone is not holding a connection yet. Scan the QR on your ' +
        'voucher, or paste the link you were sent.</p>');
      return;
    }
    sheetHTML('<p style="color:var(--dim);font-size:13px">Checking…</p>');
    try{
      var ctrl = ("AbortController" in window) ? new AbortController() : null;
      var to = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : null;
      var r = await fetch(SITE + "/api/plan?link=" + encodeURIComponent(id),
                          {cache:"no-store", signal: ctrl ? ctrl.signal : undefined});
      if(to) clearTimeout(to);
      var j = await r.json();
      if(!j.ok) throw new Error("unknown");
      if(j.token) PLAN_TOKEN = j.token;
      var rows = [
        ["Name", (j.name||"").replace(/[<>&]/g,"")],
        ["Data", j.unlimited_data ? "Unlimited" : (j.gb_left + " GB of " + j.gb_total + " GB left")],
        ["Time", j.no_expiry ? "No expiry" : (j.days_left + " days left")],
      ];
      // Unlimited data AND no expiry means renewal has nothing to add. Offering
      // it anyway sent the customer to a page that quietly turned into "build
      // and buy a plan", which is not what the word renew promises.
      var nothingToRenew = j.unlimited_data && j.no_expiry;
      sheetHTML(
        '<div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px">' +
        rows.map(function(r){
          return '<div style="display:flex;justify-content:space-between;gap:12px;' +
                 'padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px">' +
                 '<span style="color:var(--mut)">' + r[0] + '</span><b>' + r[1] + '</b></div>';
        }).join("") +
        (j.unlimited_data ? "" :
          '<div class="meterwrap" style="margin-top:14px;height:4px;background:var(--bd);border-radius:99px">' +
          '<div style="height:100%;width:' + j.pct + '%;background:var(--acc);border-radius:99px"></div></div>') +
        '</div>' +
        (nothingToRenew
          ? '<p style="color:var(--mut);font-size:13px;line-height:1.6;margin-top:14px">' +
            'This is an unlimited plan with no end date — there is nothing a ' +
            'renewal could add. You can add another connection for a second ' +
            'device whenever you need one.</p>' +
            '<div style="display:flex;margin-top:12px">' +
            '<button class="btn" id="planBuy" style="flex:1">Buy another connection</button></div>'
          : '<div style="display:flex;gap:8px;margin-top:14px">' +
            '<button class="btn" id="planRenew" style="flex:1">Renew</button>' +
            '<button class="btn" id="planBuy" style="flex:1">Buy another</button></div>'));
      var pr=$("planRenew"), pb=$("planBuy");
      if(pr) pr.onclick = function(){ showRenew(); };
      if(pb) pb.onclick = function(){ showBuy(); };
    }catch(e){
      sheetHTML('<p style="color:var(--mut);font-size:14px;line-height:1.6">' +
        "Can't reach the store right now, so the plan can't be checked. " +
        'If the site is blocked, connect first — the tunnel opens it.</p>' +
        '<p style="color:var(--dim);font-size:12.5px;margin-top:10px">' +
        'Your connection keeps working either way.</p>');
    }
  }

  // ---- renew, drawn here rather than fetched as a page ---------------------
  // The store pages were built to stand alone: their own header, language
  // picker and tab bar. Shown inside this screen they doubled everything and
  // the tabs quietly navigated away. Asking for the numbers and drawing them
  // here keeps one screen with one set of controls.
  var RENEW = null;

  function money(cents){ return "$" + (cents / 100).toFixed(2); }

  function renewMarkup(j){
    var gbRow = j.unlimited
      ? '<div style="color:var(--mut);font-size:13px;margin-bottom:14px">' +
        'Data stays unlimited — only the time is extended.</div>'
      : stepper("Data", "gb", j.gb, j.min_gb, j.max_gb, j.step_gb, "GB");
    var dayRow = j.never_expires
      ? '<div style="color:var(--mut);font-size:13px;margin-bottom:14px">' +
        'This plan has no end date — only the data is topped up.</div>'
      : stepper("Time", "days", j.days, j.min_days, j.max_days, j.step_days, "days");
    return gbRow + dayRow +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;' +
      'padding:14px 0;border-top:1px solid var(--bd);margin-top:4px">' +
      '<span style="color:var(--mut);font-size:13px">Total</span>' +
      '<b id="rPrice" style="font-size:22px">' + j.price + '</b></div>' +
      (j.card ? '<button class="btn primary" id="payCard" style="width:100%;margin-top:6px">'
                + 'Pay by card</button>' : '') +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
      (j.networks.length
        ? '<button class="btn" id="payCrypto" style="flex:1">Pay with USDT</button>' : '') +
      '<button class="btn' + (j.card ? '' : ' primary') + '" id="payVoucher" ' +
      'style="flex:1">Pay with voucher</button>' +
      '</div>' +
      '<div id="payArea" style="margin-top:14px"></div>';
  }

  function stepper(label, key, value, min, max, step, unit){
    return '<div style="display:flex;justify-content:space-between;align-items:center;' +
      'padding:12px 0;border-bottom:1px solid var(--bd)">' +
      '<span style="color:var(--mut);font-size:13px">' + label + '</span>' +
      '<span style="display:flex;align-items:center;gap:12px">' +
      '<button class="btn" data-step="' + key + '" data-dir="-1" ' +
      'style="padding:6px 12px;font-size:16px;line-height:1">−</button>' +
      '<b id="r_' + key + '" data-min="' + min + '" data-max="' + max + '" data-step="' + step +
      '" style="min-width:74px;text-align:center;font-size:15px">' + value + ' ' + unit + '</b>' +
      '<button class="btn" data-step="' + key + '" data-dir="1" ' +
      'style="padding:6px 12px;font-size:16px;line-height:1">+</button></span></div>';
  }

  function readStep(key){
    var el = $("r_" + key);
    return el ? parseInt(el.textContent, 10) : 0;
  }

  function buying(){ return $("sheetTitle").textContent === "Buy"; }

  async function priceNow(){
    var q = "?gb=" + readStep("gb") + "&days=" + readStep("days");
    var url = buying()
      ? SITE + "/api/buy" + q
      : SITE + "/api/renew" + q + "&link=" + encodeURIComponent(configId());
    try{
      var r = await fetch(url, {cache:"no-store"});
      var j = await r.json();
      if(!j.ok) return;
      if($("rPrice")) $("rPrice").textContent = j.price;
      if(buying()){ BUY = j; } else { RENEW = j; }
    }catch(e){}
  }

  async function showRenew(){
    openSheet("Renew");
    var id = configId();
    if(!id){
      sheetHTML('<p style="color:var(--mut);font-size:14px">This phone is not ' +
                'holding a connection yet.</p>');
      return;
    }
    sheetHTML('<p style="color:var(--dim);font-size:13px">Checking…</p>');
    try{
      var r = await fetch(SITE + "/api/renew?link=" + encodeURIComponent(id), {cache:"no-store"});
      var j = await r.json();
      if(!j.ok && j.error === "nothing_to_renew"){
        sheetHTML('<p style="color:var(--mut);font-size:14px;line-height:1.6">' +
          'This plan is unlimited with no end date, so there is nothing a ' +
          'renewal could add.</p>');
        return;
      }
      if(!j.ok) throw new Error(j.error || "failed");
      if(j.pending){
        sheetHTML('<p style="color:var(--mut);font-size:14px;line-height:1.6">' +
          'A renewal is already waiting to be confirmed. Once it is approved the ' +
          'time and data are added to this same connection.</p>');
        return;
      }
      RENEW = j;
      sheetHTML(renewMarkup(j));
    }catch(e){
      sheetHTML(offlineNote());
    }
  }

  // ---- a paid order finishes itself -----------------------------------------
  // A crypto payment used to end at "sent, awaiting confirmation" and stop
  // there: the config appeared on the server minutes later and nothing told the
  // phone. Watching the order closes that gap, and when it lands the customer
  // chooses what happens to it.
  var watching = null;

  function stopWatching(){
    if(watching){ clearInterval(watching); watching = null; }
  }

  function offerConfig(j){
    stopWatching();
    var name = (j.name || "your connection").replace(/[<>&]/g, "");
    $("payArea").innerHTML =
      '<div style="background:var(--card);border:1px solid var(--acc);border-radius:12px;' +
      'padding:14px;margin-bottom:12px">' +
      '<b style="font-size:14px;color:var(--acc)">Payment confirmed</b>' +
      '<div style="font-size:13px;color:var(--mut);margin-top:4px">' + name + ' is ready.</div></div>' +
      '<button class="btn primary" id="useHere" style="width:100%">Use it on this phone</button>' +
      '<button class="btn" id="saveIt" style="width:100%;margin-top:8px">Save the link instead</button>' +
      '<div id="useMsg" style="font-size:13px;margin-top:10px;color:var(--mut)"></div>';
    $("useHere").onclick = function(){
      var ok = false;
      try{ ok = !!(BR && BR.importConfig && BR.importConfig(j.link)); }catch(e){}
      $("useMsg").textContent = ok
        ? "Added. Close this and tap connect."
        : "Could not add it here — save the link and add it manually.";
      if(ok) setTimeout(function(){ closeSheet(); }, 1600);
    };
    $("saveIt").onclick = function(){
      // Deliberately shown rather than copied silently: on another device this
      // is the only copy the customer has.
      $("useMsg").innerHTML =
        '<div style="font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all;' +
        'background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px;' +
        'user-select:all;-webkit-user-select:all">' + j.link.replace(/[<>&]/g, "") + '</div>' +
        '<div style="margin-top:6px">Press and hold to copy.</div>';
    };
  }

  function watchOrder(token){
    stopWatching();
    var tries = 0;
    watching = setInterval(async function(){
      tries++;
      if(tries > 120){ stopWatching(); return; }      // ten minutes, then stop
      try{
        var r = await fetch(SITE + "/api/order/" + encodeURIComponent(token),
                            {cache:"no-store"});
        var j = await r.json();
        if(j.ok && j.status === "verified" && j.link){ offerConfig(j); }
      }catch(e){ /* offline; keep trying while the sheet is open */ }
    }, 5000);
  }

  function offlineNote(){
    return '<p style="color:var(--mut);font-size:14px;line-height:1.6">' +
      "Can't reach the store right now.</p>" +
      '<p style="color:var(--dim);font-size:12.5px;margin-top:10px">' +
      "If the site is blocked where you are, connect first — the tunnel opens " +
      "it. Your connection keeps working either way.</p>";
  }

  // steppers, payment choice and submission, all delegated from the sheet
  $("sheetBody").addEventListener("click", async function(e){
    var stepBtn = e.target.closest ? e.target.closest("[data-step]") : null;
    if(stepBtn && stepBtn.dataset.dir){
      var key = stepBtn.dataset.step, el = $("r_" + key);
      var unit = el.textContent.replace(/[\d\s]/g, "");
      var step = parseInt(el.dataset.step, 10) || 1;
      var min = parseInt(el.dataset.min, 10), max = parseInt(el.dataset.max, 10);
      var v = readStep(key) + step * parseInt(stepBtn.dataset.dir, 10);
      v = Math.max(min, Math.min(max, v));
      el.textContent = v + " " + unit;
      priceNow();
      return;
    }
    if(e.target.id === "payVoucher"){
      $("payArea").innerHTML =
        '<input id="vCode" placeholder="Voucher number" autocapitalize="characters" ' +
        'style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);' +
        'background:var(--card);color:var(--ink);font:inherit">' +
        '<button class="btn primary" id="vGo" style="width:100%;margin-top:8px">Pay</button>' +
        '<div id="payMsg" style="font-size:13px;margin-top:10px"></div>';
      return;
    }
    if(e.target.id === "payCrypto"){
      var ctx = buying() ? BUY : RENEW;
      var n = ctx.networks[0];
      $("payArea").innerHTML =
        '<div style="font-size:13px;color:var(--mut);margin-bottom:6px">Send ' +
        ctx.price + ' of USDT (' + n + ') to</div>' +
        '<div style="font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;' +
        'background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px">' +
        (ctx.wallets[n] || "") + '</div>' +
        '<input id="txh" placeholder="Transaction hash" style="width:100%;margin-top:10px;' +
        'padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);' +
        'color:var(--ink);font:inherit">' +
        '<input id="contact" placeholder="How we reach you (optional)" style="width:100%;' +
        'margin-top:8px;padding:12px;border-radius:10px;border:1px solid var(--bd);' +
        'background:var(--card);color:var(--ink);font:inherit">' +
        '<button class="btn primary" id="cGo" style="width:100%;margin-top:8px">I have paid</button>' +
        '<div id="payMsg" style="font-size:13px;margin-top:10px"></div>';
      return;
    }
    if(e.target.id === "payCard"){
      // Cards are typed on Stripe's page, not here, so this hands off to the
      // browser rather than collecting anything.
      var msg0 = $("payArea");
      msg0.innerHTML = '<div style="font-size:13px;color:var(--mut)">Opening the ' +
        'payment page…</div>';
      var isBuyCard = buying();
      // "bank", not "card": method=card is the VOUCHER, from before it was
      // renamed. Sending that here made the server try to redeem an empty
      // voucher and answer "not available or already used".
      var b = "gb=" + readStep("gb") + "&days=" + readStep("days") + "&method=bank";
      if(!isBuyCard) b += "&link=" + encodeURIComponent(configId());
      if(isBuyCard && $("devName")) b += "&name=" + encodeURIComponent($("devName").value || "");
      try{
        var rr = await fetch(SITE + (isBuyCard ? "/api/buy" : "/api/renew"),
          {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
           body: b + "&network=bank"});
        var jj = await rr.json();
        if(jj.checkout){
          if(jj.order) watchOrder(jj.order);   // the config lands here when it clears
          location.href = jj.checkout;
        } else {
          msg0.innerHTML = '<div style="font-size:13px;color:var(--amber)">' +
            (jj.error || "Card payment could not be started.") + '</div>';
        }
      }catch(err){
        msg0.innerHTML = '<div style="font-size:13px;color:var(--amber)">' +
          "Couldn't reach the store.</div>";
      }
      return;
    }
    if(e.target.id === "vGo" || e.target.id === "cGo"){
      var msg = $("payMsg");
      msg.textContent = "Sending…"; msg.style.color = "var(--dim)";
      var isBuy = buying();
      var ctx2 = isBuy ? BUY : RENEW;
      var body = "gb=" + readStep("gb") + "&days=" + readStep("days");
      if(!isBuy) body += "&link=" + encodeURIComponent(configId());
      if(isBuy && $("devName")) body += "&name=" + encodeURIComponent($("devName").value || "");
      if(e.target.id === "vGo"){
        body += "&method=card&code=" + encodeURIComponent(($("vCode").value || "").trim());
      } else {
        body += "&network=" + encodeURIComponent(ctx2.networks[0]) +
                "&tx_hash=" + encodeURIComponent(($("txh").value || "").trim()) +
                "&contact=" + encodeURIComponent(($("contact").value || "").trim());
      }
      try{
        var r = await fetch(SITE + (isBuy ? "/api/buy" : "/api/renew"), {method:"POST",
          headers:{"Content-Type":"application/x-www-form-urlencoded"}, body: body});
        var j = await r.json();
        if(j.ok && j.paid === "voucher"){
          msg.style.color = "var(--acc)";
          if(j.link && BR && BR.importConfig){
            // A purchase made in the app should end with a working connection,
            // not a QR code the customer has to scan off their own screen.
            try{ BR.importConfig(j.link); }catch(err){}
            msg.textContent = "Done — the new connection has been added to this phone.";
          } else {
            msg.textContent = "Done — renewed. " +
                              (j.left ? j.left + " left on the voucher." : "");
          }
          setTimeout(function(){ closeSheet(); }, 1900);
        } else if(j.ok && j.order){
          msg.style.color = "var(--acc)";
          msg.textContent = isBuy
            ? "Sent. Waiting for the payment to confirm — this usually takes a " +
              "few minutes, and the connection appears here when it does."
            : "Sent. Once it confirms, the time is added to this same connection.";
          if(isBuy) watchOrder(j.order);
        } else {
          msg.style.color = "var(--amber)";
          msg.textContent = j.error || "That did not go through.";
        }
      }catch(err){
        msg.style.color = "var(--amber)";
        msg.textContent = "Couldn't reach the store. Try again once connected.";
      }
    }
  });

  // ---- buying a new connection, drawn here as well -------------------------
  var BUY = null;

  async function showBuy(){
    openSheet("Buy");
    sheetHTML('<p style="color:var(--dim);font-size:13px">Checking…</p>');
    try{
      var r = await fetch(SITE + "/api/buy", {cache:"no-store"});
      var j = await r.json();
      if(!j.ok) throw new Error("failed");
      BUY = j;
      sheetHTML(
        stepper("Data", "gb", j.gb, j.min_gb, j.max_gb, j.step_gb, "GB") +
        stepper("Time", "days", j.days, j.min_days, j.max_days, j.step_days, "days") +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;' +
        'padding:14px 0;border-top:1px solid var(--bd);margin-top:4px">' +
        '<span style="color:var(--mut);font-size:13px">Total</span>' +
        '<b id="rPrice" style="font-size:22px">' + j.price + '</b></div>' +
        '<input id="devName" placeholder="Name this connection" ' +
        'style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);' +
        'background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px">' +
        (j.card ? '<button class="btn primary" id="payCard" style="width:100%">'
                  + 'Pay by card</button>' : '') +
        '<div style="display:flex;gap:8px;margin-top:8px">' +
        (j.networks.length
          ? '<button class="btn" id="payCrypto" style="flex:1">Pay with USDT</button>' : '') +
        '<button class="btn' + (j.card ? '' : ' primary') + '" id="payVoucher" ' +
        'style="flex:1">Pay with voucher</button>' +
        '</div>' +
        '<div id="payArea" style="margin-top:14px"></div>');
    }catch(e){
      sheetHTML(offlineNote());
    }
  }

  var retestBtn = $("retest");
  if(retestBtn) retestBtn.onclick = function(){ measure(false); };

  var measuredThisSession = false;
  function liveBox(){
    var box=$("live"); if(!box) return;
    if(stage.classList.contains("on")){
      box.style.display = "block";
      if(!measuredThisSession){
        measuredThisSession = true;
        setTimeout(function(){ measure(true); }, 1200);   // let the tunnel settle
      }
    } else {
      box.style.display = "none";
      measuredThisSession = false;
      TRAFFIC = null;                 // a fresh question next time it comes up
      showSpeed("—");
    }
  }
  setInterval(liveBox, 1200);

  // ---- bring the bridge up, waiting for it on a cold start ------------------
  function boot(){
    BR = bridge();
    if(BR){ refresh(); return true; }
    return false;
  }
  if(!boot()){
    var tries=0, hunt=setInterval(function(){
      if(boot() || ++tries>40){ clearInterval(hunt); if(!BR){ paint(false); stamp(); } }
    }, 250);
  }
  // in a plain browser (no bridge, e.g. testing) still render a sane empty state
  setTimeout(function(){ if(!BR){ drawConfigs(); paint(false); } }, 300);
})();
</script>
</body>
</html>
