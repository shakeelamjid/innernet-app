name: Build Innernet APK

# Mirrors upstream v2rayNG's own build. A plain `gradlew assembleRelease` fails:
# the project needs git submodules, a specific NDK, a natively compiled tunnel
# library, and a prebuilt Xray .aar from a matching release.
on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'Architectures (arm64-v8a covers phones from ~2015 on; use "arm64-v8a;armeabi-v7a" to include very old devices)'
        required: false
        default: 'arm64-v8a'
        type: string
  push:
    branches: [main]
    paths: ['brand.sh', 'fix_shortcuts.py', 'add_webview.py', 'branding/**', 'assets/**', '.github/workflows/build-apk.yml']

permissions:
  contents: write

env:
  NDK_VERSION: '29.0.14206865'
  # The human-facing build number. Bump this on every release, and bump
  # APP_BUILD_LATEST on the panel to match — that pairing is what makes the
  # in-app "a newer version is available" banner appear. It is deliberately NOT
  # the bridge version, which only changes when a bridge method changes.
  APP_BUILD: '1.1'

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` cannot be used in a step-level `if`, so surface it as env here.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Fetch v2rayNG with submodules
        run: |
          git clone --recurse-submodules https://github.com/2dust/v2rayNG upstream
          cd upstream/AndroidLibXrayLite && git fetch --tags --force
          echo "submodules:"; ls ../AndroidLibXrayLite ../hev-socks5-tunnel | head

      - name: Apply Innernet branding
        env:
          SITE_URL: https://innernetcorp.com/buy
          WEB_URL: https://innernetcorp.com/m
        run: |
          chmod +x brand.sh
          ./brand.sh

      - name: Stamp the build number
        working-directory: upstream
        run: |
          set -euo pipefail
          F=V2rayNG/app/build.gradle.kts
          BASE=$(grep -oP 'versionCode = \K[0-9]+' "$F" | head -1)
          NAME=$(grep -oP 'versionName = "\K[^"]+' "$F" | head -1)
          # Android refuses to install an APK whose versionCode is lower than
          # the installed one, so this must only ever go UP. Upstream's base is
          # already in the hundreds; adding the run number keeps us above every
          # build we have shipped and above upstream's own numbering.
          NEW=$(( BASE + ${{ github.run_number }} ))
          sed -i -E "0,/versionCode = [0-9]+/s//versionCode = ${NEW}/" "$F"
          # Keep upstream's name and mark our build, so the site shows something
          # that actually changes between releases.
          sed -i -E "0,/versionName = \"[^\"]+\"/s//versionName = \"${NAME}-b${{ github.run_number }}\"/" "$F"
          grep -nE 'versionCode = |versionName = ' "$F" | head -2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Versions and inputs copied from upstream's own workflow — the `packages`
      # and `cmdline-tools-version` inputs require v4.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK and pin it in Gradle
        working-directory: upstream
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          fi
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager not found"; ls -R "$ANDROID_HOME" | head -40; exit 1; }
          echo "using: $SDKMANAGER"
          echo "y" | "$SDKMANAGER" --channel=0 --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          # declare ndkVersion inside the android { } block
          sed -i "0,/compileSdk/s//ndkVersion = \"${NDK_VERSION}\"\n    compileSdk/" \
            V2rayNG/app/build.gradle.kts
          grep -n 'ndkVersion\|applicationId\|namespace' V2rayNG/app/build.gradle.kts | head -5

      - name: Build the native tunnel library
        working-directory: upstream
        run: |
          test -d "$NDK_HOME" || { echo "NDK missing at $NDK_HOME"; exit 1; }
          bash compile-hevtun.sh
          ls -R libs | head -20

      - name: Copy the native library into the app
        working-directory: upstream
        run: cp -r libs V2rayNG/app/

      - name: Work out which Xray core to fetch
        working-directory: upstream/AndroidLibXrayLite
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          echo "Xray core tag: $TAG"
          echo "XRAY_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.XRAY_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: upstream/V2rayNG/app/libs/

      - name: Decode the signing keystore
        if: env.HAS_KEYSTORE == 'true'
        id: keystore
        uses: timheuer/base64-to-file@v2.0.0
        with:
          fileName: 'innernet.keystore'
          encodedString: ${{ secrets.KEYSTORE_B64 }}

      # ABI_FILTERS is an upstream-supported property, so we build one
      # architecture instead of five, and only the playstore flavour instead of
      # both. One APK out, not ten.
      - name: Build the APK
        working-directory: upstream/V2rayNG
        env:
          ABIS: ${{ inputs.abis || 'arm64-v8a' }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          echo "Building for: $ABIS"
          if [ -n "${{ steps.keystore.outputs.filePath }}" ]; then
            echo "Building SIGNED"
            ./gradlew assemblePlaystoreRelease --no-daemon --stacktrace \
              -PABI_FILTERS="$ABIS" \
              -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.filePath }} \
              -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
              -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
              -Pandroid.injected.signing.key.password='${{ secrets.KEYSTORE_PASSWORD }}'
          else
            echo "No keystore secret — building UNSIGNED (will not install on a phone)."
            ./gradlew assemblePlaystoreRelease --no-daemon --stacktrace -PABI_FILTERS="$ABIS"
          fi

      - name: Collect the APKs
        run: |
          mkdir -p out
          find upstream/V2rayNG/app/build/outputs/apk -name '*.apk' \
               ! -name '*unsigned*' -exec cp {} out/ \;
          # rename to something a customer sees and understands
          i=0
          for f in out/*.apk; do
            i=$((i+1))
            mv "$f" "out/innernet-$(grep -oP 'versionName = "\K[^"]+' upstream/V2rayNG/app/build.gradle.kts)-$(basename "$f" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86|universal' || echo app).apk"
          done
          ls -lh out/

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: innernet-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish a release
        if: ${{ github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Innernet APK build ${{ github.run_number }}
          files: out/*.apk
