name: Build Innernet APK

# Mirrors upstream v2rayNG's own build, which needs more than a plain gradle run:
# git submodules, a specific NDK, a natively compiled tunnel library, and a
# prebuilt Xray .aar downloaded from a matching release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['brand.sh', 'fix_shortcuts.py', 'branding/**', '.github/workflows/build-apk.yml']

permissions:
  contents: write

env:
  NDK_VERSION: '29.0.14206865'

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` cannot be used in a step-level `if`, so surface it as env here.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # Submodules are required: AndroidLibXrayLite supplies the Xray core tag,
      # hev-socks5-tunnel is compiled into the native tunnel library.
      - name: Fetch v2rayNG with submodules
        run: |
          git clone --recurse-submodules https://github.com/2dust/v2rayNG upstream
          cd upstream/AndroidLibXrayLite && git fetch --tags --force

      - name: Apply Innernet branding
        env:
          SITE_URL: https://innernetcorp.com/buy
        run: |
          chmod +x brand.sh
          ./brand.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37 build-tools;37.0.0 platform-tools'

      - name: Install NDK and pin it in Gradle
        working-directory: upstream
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          # declare the ndkVersion inside the android { } block
          sed -i "0,/compileSdk/s//ndkVersion = \"${NDK_VERSION}\"\n    compileSdk/" \
            V2rayNG/app/build.gradle.kts
          grep -n 'ndkVersion' V2rayNG/app/build.gradle.kts

      - name: Build the native tunnel library
        working-directory: upstream
        run: bash compile-hevtun.sh

      - name: Copy the native library into the app
        working-directory: upstream
        run: cp -r libs V2rayNG/app/

      - name: Work out which Xray core to fetch
        working-directory: upstream/AndroidLibXrayLite
        run: |
          TAG="$(git describe --tags --abbrev=0)"
          echo "Xray core tag: $TAG"
          echo "XRAY_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.XRAY_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: upstream/V2rayNG/app/libs/

      - name: Decode the signing keystore
        if: env.HAS_KEYSTORE == 'true'
        id: keystore
        uses: timheuer/base64-to-file@v2.0.0
        with:
          fileName: 'innernet.keystore'
          encodedString: ${{ secrets.KEYSTORE_B64 }}

      - name: Build the APK
        working-directory: upstream/V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew licenseFdroidReleaseReport --no-daemon
          if [ -n "${{ steps.keystore.outputs.filePath }}" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.filePath }} \
              -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
              -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
              -Pandroid.injected.signing.key.password='${{ secrets.KEYSTORE_PASSWORD }}'
          else
            echo "No keystore secret set — building UNSIGNED (will not install on a phone)."
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Collect the APKs
        run: |
          mkdir -p out
          find upstream/V2rayNG/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: innernet-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish a release
        if: ${{ github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Innernet APK build ${{ github.run_number }}
          files: out/*.apk
